# Webseite glutnest.eu hinter einem vorhandenen Traefik.
# Voreinstellung passt zum Traefik auf bootsmann: Netz "proxy", Entrypoint "websecure"
# (dort hängen schon die security-headers@file), Zertifikat per DNS-Challenge "letsencryptdns".
# Abweichend per .env: TRAEFIK_NETZ, TRAEFIK_ENTRYPOINT, TRAEFIK_CERTRESOLVER.
services:
  webseite:
    image: ghcr.io/siliconserver/glutnest.eu:latest
    container_name: glutnest-webseite
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETZ:-proxy}
      - traefik.http.services.glutnest-web.loadbalancer.server.port=8080
      # glutnest.eu
      - traefik.http.routers.glutnest-web.rule=Host(`glutnest.eu`)
      - traefik.http.routers.glutnest-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.glutnest-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptdns}
      # www.glutnest.eu leitet dauerhaft auf glutnest.eu um
      - traefik.http.routers.glutnest-www.rule=Host(`www.glutnest.eu`)
      - traefik.http.routers.glutnest-www.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.glutnest-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptdns}
      - traefik.http.routers.glutnest-www.middlewares=glutnest-www
      - traefik.http.middlewares.glutnest-www.redirectregex.regex=^https?://www\.glutnest\.eu/(.*)
      - traefik.http.middlewares.glutnest-www.redirectregex.replacement=https://glutnest.eu/$${1}
      - traefik.http.middlewares.glutnest-www.redirectregex.permanent=true

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETZ:-proxy}
